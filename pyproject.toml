[project]
name = "mcp-vs-cli"
version = "0.1.0"
description = "What does an MCP server cost in context, and what do you get back for it? A reproducible benchmark over a real public API."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "openai>=2.51.0",
    "rich>=13.9",
    "tiktoken>=0.8",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
